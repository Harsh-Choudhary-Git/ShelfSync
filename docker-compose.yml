services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: shelfsync-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shelfsync}
      POSTGRES_USER: ${POSTGRES_USER:-shelfsync_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shelfsync_secure_password}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shelfsync_user} -d ${POSTGRES_DB:-shelfsync}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Spring Boot Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shelfsync-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-shelfsync}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-shelfsync_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-shelfsync_secure_password}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      APP_JWT_SECRET: ${APP_JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      APP_JWT_EXPIRATION_MS: ${APP_JWT_EXPIRATION_MS:-86400000}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost:80,http://localhost}
    ports:
      - "8080:8080"

  # React Frontend Single Page App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shelfsync-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  pgdata:
    driver: local
